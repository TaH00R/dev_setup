name: Build Dev Setup CLI preview

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install "pyinstaller>=6,<7"

    - name: Build EXE with PyInstaller
      run: |
        python -m PyInstaller --onefile --name dev-setup-cli --add-data "catalog:catalog" --add-data "package_managers/scoop_bridge.ps1:package_managers" main.py

    - name: Check bundled catalog
      run: |
        .\dist\dev-setup-cli.exe catalog validate
        .\dist\dev-setup-cli.exe catalog search git

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: dev-setup-cli-preview
        path: dist/dev-setup-cli.exe

  release-upload:
    needs: build
    # Only run if this workflow was triggered by a release AND a tag exists
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
    - name: Download built EXE
      uses: actions/download-artifact@v4
      with:
        name: dev-setup-cli-preview

    - name: Upload EXE to Release
      uses: softprops/action-gh-release@v2
      with:
        files: dev-setup-cli.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
