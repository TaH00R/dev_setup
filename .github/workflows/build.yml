name: Desktop preview bundles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Qt Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install build dependencies
        run: python -m pip install -r requirements-gui.txt -r requirements-security.txt "pyinstaller>=6.22,<7"
      - name: Migration, release verification and diagnostics checks
        run: python -m unittest tests.unit.test_persistence tests.unit.test_updates tests.unit.test_diagnostics tests.integration.test_packaging
      - name: Build desktop and run bounded bundle checks
        run: python scripts/build_desktop.py --smoke-test --archive
      - uses: actions/upload-artifact@v4
        with:
          name: DevSetup-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/DevSetup-*.zip
            dist/DevSetup-*.tar.gz
            dist/DevSetup-*.json
          if-no-files-found: error
