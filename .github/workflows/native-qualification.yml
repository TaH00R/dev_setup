name: Disposable native smoke (qualification pending)

on:
  workflow_dispatch:
    inputs:
      approve_native_changes:
        description: 'Approve package changes, private index refreshes and controlled DPKG interruption on disposable hosted runners only'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  apt:
    if: ${{ inputs.approve_native_changes }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
      options: --init
    timeout-minutes: 20
    steps:
      - name: Explicit disposable image preparation
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes python3 ca-certificates git
      - uses: actions/checkout@v4
      - name: Exercise APT plans and verification
        run: python3 -m scripts.qualify_native --backend apt --approve-native-changes --output native-apt.json
      - name: Exercise a real older-to-current APT Git upgrade
        run: python3 -m scripts.qualify_native --backend apt --apt-upgrade --approve-native-changes --output native-apt-upgrade.json
      - name: Exercise native cancellation recovery and verification failure
        run: python3 -m scripts.qualify_native --backend apt --apt-failures --approve-native-changes --output native-apt-failures.json
      - name: Reject altered origins with a private read-only native cache
        run: python3 -m scripts.qualify_native --backend apt --apt-origins --approve-native-changes --output native-apt-origins.json
      - name: Reject changed repository URLs with private sources and cache
        run: python3 -m scripts.qualify_native --backend apt --apt-sources --approve-native-changes --output native-apt-sources.json
      - name: Reject stale approval after private signing-key changes
        run: python3 -m scripts.qualify_native --backend apt --apt-keys --approve-native-changes --output native-apt-keys.json
      - name: Authenticate metadata integrity and signed time bounds
        run: python3 -m scripts.qualify_native --backend apt --apt-auth --approve-native-changes --output native-apt-auth.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-apt-smoke-pending
          path: |
            native-apt.json
            native-apt-upgrade.json
            native-apt-failures.json
            native-apt-origins.json
            native-apt-sources.json
            native-apt-keys.json
            native-apt-auth.json
          if-no-files-found: warn
  apt-dpkg:
    if: ${{ inputs.approve_native_changes }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5
      options: --init
    timeout-minutes: 20
    steps:
      - name: Prepare isolated disposable DPKG fault image
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes python3 ca-certificates
      - uses: actions/checkout@v4
      - name: Cancel controlled DPKG unpack and reject unverified recovery
        run: python3 -m scripts.qualify_native --backend apt --apt-dpkg --approve-native-changes --output native-apt-dpkg.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-apt-dpkg-pending
          path: native-apt-dpkg.json
          if-no-files-found: warn
  homebrew:
    if: ${{ inputs.approve_native_changes }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise Homebrew core plans and verification
        run: python -m scripts.qualify_native --backend homebrew --approve-native-changes --output native-homebrew.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-homebrew-smoke-pending
          path: native-homebrew.json
          if-no-files-found: warn
