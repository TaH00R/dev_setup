name: Baseline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies including the terminal UI
        run: python -m pip install -r requirements.txt -r requirements-tui.txt -r requirements-security.txt
      - name: Run deterministic unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - name: Check application catalog commands
        run: |
          python -m app catalog validate
          python -m app catalog search git

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m app catalog validate
      - run: git diff --check

  native-inventory:
    name: Read-only inventory on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DEV_SETUP_NATIVE_INVENTORY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.integration.test_inventory_native.NativeInventoryTests.test_host_read_only_inventory -v

  linux-inventory:
    name: Read-only ${{ matrix.backend }} inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            distro: ubuntu
            backend: apt
          - image: archlinux:base
            distro: arch
            backend: pacman
          - image: fedora:43
            distro: fedora
            backend: dnf
          - image: opensuse/tumbleweed:latest
            distro: opensuse-tumbleweed
            backend: zypper
          - image: alpine:3.22
            distro: alpine
            backend: apk
    env:
      DEV_SETUP_INVENTORY_IMAGE: ${{ matrix.image }}
      DEV_SETUP_INVENTORY_DISTRO: ${{ matrix.distro }}
      DEV_SETUP_INVENTORY_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect disposable native database without installations
        run: python -m unittest tests.integration.test_inventory_native.NativeInventoryTests.test_linux_image_read_only_inventory -v
