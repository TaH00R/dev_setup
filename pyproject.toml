[tool.ruff]
target-version = "py310"
line-length = 88
include = ["models/**/*.py", "system/**/*.py", "catalog/**/*.py", "package_managers/**/*.py", "services/**/*.py", "system_info.py", "tests/test_core_import.py", "tests/test_cli.py", "tests/test_domain_*.py", "tests/test_catalog*.py", "tests/test_command*.py", "tests/test_adapters*.py", "tests/test_scoop_bridge.py", "tests/test_services*.py", "tests/test_inspection.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["models", "system", "catalog", "package_managers", "services"]
strict = true
warn_unused_configs = true
